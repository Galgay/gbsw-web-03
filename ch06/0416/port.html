<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap");
            * {
                font-family: "Gamja Flower", "Noto Sans";
                box-sizing: border-box;
            }

            html,
            body {
                background-color: rgb(66, 66, 66);
            }

            h1 {
                color: white;
            }

            .wrap {
                width: 100%;
                display: flex;
                background-color: rgb(255, 220, 163);
            }

            .profile_wrap {
                font-size: 18px;
                width: 50%;
                /* color: white; */
            }

            .profile_wrap > div {
                margin: 10px;
            }

            .btn_wrap {
                width: 50%;
                color: white;
                padding: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                column-gap: 10px;
            }

            .btn_wrap button {
                width: 180px;
                height: 60px;
                background-color: rgb(74, 74, 74);
                color: beige;
                cursor: pointer;
                border-radius: 10px;
                border: none;
                box-shadow: 2px 2px 5px rgb(133, 133, 133);
                transition: all ease 0.3s;
            }

            .btn_wrap button:hover {
                background-color: rgb(255, 154, 171);
                box-shadow: 2px 2px 5px rgb(79, 79, 79);
                scale: 1.1;
            }

            img {
                width: 10%;
            }
        </style>
    </head>
    <body>
        <h1>안녕하세요, 서정민입니다.</h1>
        <div class="wrap">
            <div class="profile_wrap">
                <div>나이:</div>
                <div>취미:</div>
                <div>장래희망:</div>
            </div>
            <div class="btn_wrap">
                <button class="btn btn-1" onclick="goNaver()">버튼1</button>
                <button class="btn btn-2">버튼2</button>
                <button class="btn btn-3">버튼3</button>
            </div>
        </div>
        <img
            src="https://i.pinimg.com/originals/85/d7/5e/85d75ef11cbd76a791bf6809bfa69af9.gif"
        />
    </body>
    <script>
        function goNaver() {
            location.href = "https://galgay.vercel.app";
        }
    </script>
</html>
