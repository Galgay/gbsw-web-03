<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>호텔 체크인 관리</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background: linear-gradient(
                    135deg,
                    rgb(66, 52, 35),
                    rgb(45, 36, 24)
                );
                color: white;
                font-family: Arial, sans-serif;
            }

            h1 {
                color: burlywood;
                text-align: center;
            }

            p {
                font-size: 18px;
            }

            .wrap {
                width: 90%;
                max-width: 700px;
                background-color: rgba(255, 255, 255, 0.12);
                border-radius: 16px;
                padding: 25px;
                margin: 30px auto;
                backdrop-filter: blur(6px);
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            }

            img {
                width: 100%;
                border-radius: 12px;
                margin-bottom: 20px;
            }

            .box {
                padding: 20px;
                margin: 18px 0;
                border-radius: 14px;
            }

            .checkin_wrap {
                background-color: #4d4b68;
            }

            .room_wrap {
                background-color: #684b4d;
                text-align: center;
            }

            h2 {
                margin-top: 0;
            }

            input {
                width: 70%;
                padding: 12px;
                border: none;
                border-radius: 10px;
                outline: none;
                font-size: 16px;
            }

            button {
                padding: 12px 18px;
                border: none;
                border-radius: 10px;
                background-color: burlywood;
                color: black;
                font-weight: bold;
                cursor: pointer;
                transition: 0.2s;
            }

            button:hover {
                background-color: rgb(255, 214, 160);
                transform: scale(1.03);
            }

            ul {
                padding-left: 20px;
            }

            li {
                margin: 10px 0;
                padding: 10px;
                background-color: rgba(255, 255, 255, 0.1);
                border-radius: 8px;
            }

            #room_cnt {
                font-size: 30px;
                font-weight: bold;
                color: #ffe7c2;
            }
        </style>
    </head>

    <body>
        <div class="wrap">
            <h1>🏨 경소고 호텔 체크인 관리</h1>

            <p>경소고 호텔의 체크인 / 체크아웃을 관리하는 페이지입니다.</p>

            <img src="./hotel.png" alt="호텔 이미지" />

            <!-- 체크인 목록 -->
            <div class="box checkin_wrap">
                <h2>체크인 목록</h2>

                <ul id="checkin_list">
                    <li>손님 1</li>
                    <li>손님 2</li>
                    <li>손님 3</li>
                </ul>
            </div>

            <!-- 체크인 -->
            <div class="box checkin_wrap">
                <h2>체크인</h2>

                <input
                    id="input_name"
                    type="text"
                    placeholder="손님 이름 입력"
                />

                <button id="btn_checkin">체크인</button>
            </div>

            <!-- 체크아웃 -->
            <div class="box checkin_wrap">
                <h2>체크아웃</h2>

                <input
                    id="input_num"
                    type="number"
                    placeholder="삭제할 번호 입력"
                />

                <button id="btn_checkout">체크아웃</button>
            </div>

            <!-- 빈 방 -->
            <div class="box room_wrap">
                <h2>빈 방 개수</h2>

                <p id="room_cnt"></p>
            </div>
        </div>

        <script>
            // 최대 방 개수
            const MAX_ROOM = 100;

            // 요소 가져오기
            const checkinList = document.getElementById("checkin_list");
            const inputName = document.getElementById("input_name");
            const btnCheckin = document.getElementById("btn_checkin");

            const inputNum = document.getElementById("input_num");
            const btnCheckout = document.getElementById("btn_checkout");

            const roomCnt = document.getElementById("room_cnt");

            // 빈 방 업데이트 함수
            function updateRoomCount() {
                const guestCount = checkinList.children.length;
                roomCnt.textContent = `${MAX_ROOM - guestCount}개`;
            }

            // 체크인 함수
            function checkin() {
                const name = inputName.value.trim();

                if (name === "") {
                    alert("손님 이름을 입력하세요.");
                    return;
                }

                // 방 가득 찼는지 확인
                if (checkinList.children.length >= MAX_ROOM) {
                    alert("빈 방이 없습니다.");
                    return;
                }

                const li = document.createElement("li");
                li.textContent = name;

                checkinList.appendChild(li);

                inputName.value = "";

                updateRoomCount();
            }

            // 체크아웃 함수
            function checkout() {
                const num = Number(inputNum.value);

                if (num < 1 || num > checkinList.children.length) {
                    alert("올바른 번호를 입력하세요.");
                    return;
                }

                checkinList.children[num - 1].remove();

                inputNum.value = "";

                updateRoomCount();
            }

            // 버튼 이벤트
            btnCheckin.addEventListener("click", checkin);

            btnCheckout.addEventListener("click", checkout);

            // Enter 입력 지원
            inputName.addEventListener("keydown", function (e) {
                if (e.key === "Enter") {
                    checkin();
                }
            });

            inputNum.addEventListener("keydown", function (e) {
                if (e.key === "Enter") {
                    checkout();
                }
            });

            // 최초 실행
            updateRoomCount();
        </script>
    </body>
</html>
